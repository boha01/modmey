name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build real Dobby static libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          git clone --depth 1 https://github.com/jmpews/Dobby.git /tmp/Dobby
          for ABI in arm64-v8a armeabi-v7a; do
            "$CMAKE" -S /tmp/Dobby -B "/tmp/dobby-$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-26 \
              -DDOBBY_GENERATE_SHARED=OFF \
              -DDOBBY_DEBUG=OFF \
              -DPlugin.SymbolResolver=OFF \
              -DPlugin.Android.BionicLinkerUtil=OFF \
              -DCMAKE_BUILD_TYPE=Release
            "$CMAKE" --build "/tmp/dobby-$ABI" -j"$(nproc)"
            mkdir -p "app/src/main/cpp/dobby/$ABI"
            LIB_PATH=$(find "/tmp/dobby-$ABI" -name "libdobby*.a" | head -n 1)
            test -n "$LIB_PATH"
            cp "$LIB_PATH" "app/src/main/cpp/dobby/$ABI/libdobby.a"
          done
          cp /tmp/Dobby/include/dobby.h app/src/main/cpp/dobby/dobby.h
          ls -lh app/src/main/cpp/dobby/*/libdobby.a

      - name: Build single-DEX release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.repository.max.tentatives=6 -Dorg.gradle.internal.repository.initial.backoff=5000"
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          ok=0
          for i in 1 2 3; do
            echo "=== Build attempt $i ==="
            if gradle assembleRelease --stacktrace --refresh-dependencies; then ok=1; break; fi
            echo "Attempt $i failed — waiting 60s and retrying"
            gradle --stop || true
            sleep 60
          done
          if [ "$ok" != "1" ]; then echo "All build attempts failed"; exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModMenuPro-release-apk
          path: app/build/outputs/apk/release/app-release.apk
